data:
  input_signal:
    type: csv
    path: data/signal.csv
  smoothed_signal:
    type: csv
    path: results/smoothed.csv
  cleaned_signal:
    type: csv
    path: results/cleaned.csv
parameters:
  num_samples: 200

pipeline:
- name: generate_signal
  task: tasks/generate_signal.py
  outputs:
    --output: $input_signal
  args:
    --samples: $num_samples
- group: refine
  multi_pass:
    schedule:
    - window_size: 20
      threshold: 5
    - window_size: 10
      threshold: 2
    - window_size: 5
      threshold: 1
    condition:
      script: conditions/has_converged.py
      inputs:
        cleaned_csv: $cleaned_signal
      args:
        tolerance: 0.05
    feedback:
      filter_signal.--output: smooth_signal.input_csv
  steps:
  - name: smooth_signal
    task: tasks/smooth_signal.py
    inputs:
      input_csv: $input_signal
    outputs:
      --output: $smoothed_signal
    args:
      --window-size: $window_size

  - name: filter_signal
    task: tasks/filter_signal.py
    inputs:
      input_csv: $smoothed_signal
    outputs:
      --output: $cleaned_signal
    args:
      --threshold: $threshold

- name: summarize
  task: tasks/summarize.py
  inputs:
    input_csv: $cleaned_signal
editor:
  autoSave: true
layout:
  generate_signal:
    x: 428
    y: 245
  smooth_signal:
    x: 2298
    y: 232
  filter_signal:
    x: 4168
    y: 150
  summarize:
    x: 6038
    y: 258
  data_input_signal:
    x: 1398
    y: 261
  data_smoothed_signal:
    x: 3268
    y: 179
  data_cleaned_signal:
    x: 5138
    y: 261
  param_num_samples:
    x: 50
    y: 266
