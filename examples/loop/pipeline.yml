data:
  input_texts:
    type: data_folder
    path: data/input
    description: Folder of text files to process
  processed_texts:
    type: data_folder
    path: data/output
    description: Folder of uppercased text files
  summary_txt:
    type: txt
    path: data/summary.txt
    description: Summary of all processed files
parameters:
  prefix: "PROCESSED"

pipeline:
- name: uppercase_each
  task: tasks/uppercase.py
  loop:
    over: $input_texts
    into: $processed_texts
    parallel: false
    filter: '*.txt'
  inputs:
    input: $loop_item
  outputs:
    --output: $loop_output
  args:
    --prefix: $prefix
- name: summarize
  task: tasks/summarize.py
  inputs:
    folder: $processed_texts
  outputs:
    --output: $summary_txt
layout:
  uppercase_each:
    x: 799
    y: -17
  summarize:
    x: 1718
    y: 98
  data_input_texts:
    x: 50
    y: 114
  data_processed_texts:
    x: 1298
    y: 114
  data_summary_txt:
    x: 2208
    y: 114
  param_prefix:
    x: 368
    y: 299
editor:
  autoSave: true
